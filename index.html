<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сайт-визитка</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>

    <main class="card" role="main">
      <p class="tag">Привет! Я</p>
      <h1>Ваше имя</h1>
      <p class="description">
        Веб-разработчик, который любит создавать быстрые и красивые интерфейсы.
        Кликайте или нажимайте по экрану — звезды реагируют на ваши действия.
      </p>

      <section class="info">
        <h2>Обо мне</h2>
        <ul>
          <li>📍 Город: Ваш город</li>
          <li>💼 Опыт: 3+ года</li>
          <li>🛠️ Стек: HTML, CSS, JavaScript, React</li>
          <li>✉️ Email: you@example.com</li>
        </ul>
      </section>

      <div class="actions">
        <a href="mailto:you@example.com" class="btn">Связаться</a>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
